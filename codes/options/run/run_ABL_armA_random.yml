# Component-ablation arm -- A: random init, full loss
# Validation-only: execution.skip_test keeps every final benchmark closed.
name: ABL_armA_random
output_root: experiments/ABL_armA_random

execution:
  skip_test: true
  resume: true
  fail_fast: true

runs:
  - scale: 4
    train_opt: codes/options/train/train_ABL_armA_random.yml
    seeds: [0, 1, 2]

selection:
  checkpoint: best_val
  metric: div2k_valid_psnr_y
