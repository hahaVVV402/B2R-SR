#### general settings
name: DARTSR_RCAN_local
use_tb_logger: true
model: sr
distortion: sr
scale: 4
gpu_ids: [0]  # 单卡训练，根据你的 GPU 调整

#### network structures
network_G:
  which_model_G: RCAN
  n_resblocks: 20
  n_feats: 36
  n_resgroups: 10
  res_scale: 1
  n_colors: 3
  rgb_range: 255
  scale: 4
  reduction: 16
  plugin:
    enable: true
    route_window: 8
    tau0: 0.5
    alpha: 0.35
    var_weight: 0.2
    hard_train_after: 20000
    hard_infer: true
    use_ste: true
    target_keep_min: 0.45
    target_keep_max: 0.95
    static_flops_ratio: 0.25
    base_flops: 10.33
    freeze_backbone: true
    deg_estimator:
      enable: true
      hidden_dim: 32

#### datasets
datasets:
  train:
    name: DIV2K
    mode: LQGT_rcan
    # TODO: 修改为你的数据路径
    dataroot_GT: /path/to/DIV2K/HR
    dataroot_LQ: /path/to/DIV2K/LR_bicubic/X4
    use_shuffle: true
    n_workers: 4  # 根据你的 CPU 核心数调整
    batch_size: 16  # 根据你的 GPU 显存调整（24GB 可用 16-24）
    GT_size: 96
    use_flip: true
    use_rot: true
    color: RGB
  val:
    name: Set5
    mode: LQGT_rcan
    # TODO: 修改为你的验证集路径
    dataroot_GT: /path/to/Set5/HR
    dataroot_LQ: /path/to/Set5/LR_bicubic/X4

#### path
path:
  # TODO: 修改为你的预训练模型路径
  pretrain_model_G: /Users/wenwujiang/ClassSR/experiments/pre_trained_models/RCAN_BIX4.pth
  strict_load: true
  resume_state: ~

#### training settings
train:
  lr_G: !!float 2e-4
  lr_scheme: CosineAnnealingLR_Restart
  beta1: 0.9
  beta2: 0.99
  niter: 120000
  warmup_iter: -1
  T_period: [120000]
  restarts: [120000]
  restart_weights: [1]
  eta_min: !!float 1e-7

  pixel_criterion: l1
  pixel_weight: 1.0
  plugin_loss:
    budget_weight: 0.5
    sparse_weight: 0.1
    tv_weight: 0.05
    deg_weight: 0.05

  manual_seed: 10
  val_freq: !!float 2000

#### logger
logger:
  print_freq: 100
  save_checkpoint_freq: !!float 2000
