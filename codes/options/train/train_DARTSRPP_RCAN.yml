#### general settings
name: DARTSRPP_RCAN
use_tb_logger: true
model: sr
distortion: sr
scale: 4
gpu_ids: [0, 1, 2, 3]

#### network structures
network_G:
  which_model_G: RCAN
  n_resblocks: 20
  n_feats: 36
  n_resgroups: 10
  res_scale: 1
  n_colors: 3
  rgb_range: 255
  scale: 4
  reduction: 16
  plugin:
    enable: true
    # Keep the original DART-SR path available through routing_mode: threshold.
    # benefit_topk enables the DART++ benefit-aware top-k routing path.
    routing_mode: benefit_topk
    route_window: 8
    tau0: 0.5
    alpha: 0.35
    var_weight: 0.2
    hard_train_after: 20000
    hard_infer: true
    use_ste: true
    benefit_teacher_mode: warmup
    sync_latency: false
    target_keep_min: 0.45
    target_keep_max: 0.95
    static_flops_ratio: 0.25
    base_flops: 10.33
    freeze_backbone: true
    budget_allocator:
      enable: true
      user_budget: 0.70
      hidden_dim: 32
      delta_scale: 0.15
    cheap_path:
      enable: true
      hidden_scale: 0.25
    deg_estimator:
      enable: true
      hidden_dim: 32

#### datasets
datasets:
  train:
    name: DIV2K
    mode: LQGT_rcan
    dataroot_GT: /data0/xtkong/data/DIV2K_scale_sub/GT
    dataroot_LQ: /data0/xtkong/data/DIV2K_scale_sub/LR
    use_shuffle: true
    n_workers: 6
    batch_size: 24
    GT_size: 96
    use_flip: true
    use_rot: true
    color: RGB
  val:
    name: Set5
    mode: LQGT_rcan
    dataroot_GT: /data0/xtkong/ClassSR/datasets/Set5/HR
    dataroot_LQ: /data0/xtkong/ClassSR/datasets/Set5/LR

#### path
path:
  pretrain_model_G: /data0/xtkong/ClassSR-github/experiments/pre_trained_models/RCAN_branch1.pth
  strict_load: true
  resume_state: ~

#### training settings
train:
  lr_G: !!float 2e-4
  lr_scheme: CosineAnnealingLR_Restart
  beta1: 0.9
  beta2: 0.99
  niter: 120000
  warmup_iter: -1
  T_period: [120000]
  restarts: [120000]
  restart_weights: [1]
  eta_min: !!float 1e-7

  pixel_criterion: l1
  pixel_weight: 1.0
  plugin_loss:
    budget_weight: 0.5
    sparse_weight: 0.1
    benefit_weight: 0.2
    tv_weight: 0.05
    deg_weight: 0.05

  manual_seed: 10
  val_freq: !!float 2000

#### logger
logger:
  print_freq: 100
  save_checkpoint_freq: !!float 2000
