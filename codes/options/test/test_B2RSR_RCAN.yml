#### general settings
name: test_B2RSR_RCAN
model: sr
distortion: sr
scale: 4
crop_border: ~
gpu_ids: [0]

#### network structures
network_G:
  which_model_G: RCAN
  n_resblocks: 20
  n_feats: 64
  n_resgroups: 10
  res_scale: 1
  n_colors: 3
  rgb_range: 255
  scale: 4
  reduction: 16
  plugin:
    enable: true
    routing_mode: benefit_topk
    route_window: 8
    tau0: 0.5
    alpha: 0.35
    var_weight: 0.2
    hard_train_after: 20000
    hard_infer: true
    use_ste: true
    benefit_teacher_mode: warmup
    sync_latency: true
    target_keep_min: 0.45
    target_keep_max: 0.95
    static_flops_ratio: 0.25
    base_flops: 0.0  # set after profiling the full-width backbone at this scale
    freeze_backbone: true
    budget_allocator:
      enable: true
      user_budget: 0.70
      hidden_dim: 32
      delta_scale: 0.15
    cheap_path:
      enable: true
      hidden_scale: 0.25
    deg_estimator:
      enable: true
      hidden_dim: 32

datasets:
  test1:
    name: set5
    mode: LQGT_rcan
    dataroot_GT: /data0/xtkong/ClassSR/datasets/Set5/HR
    dataroot_LQ: /data0/xtkong/ClassSR/datasets/Set5/LR

#### path
path:
  pretrain_model_G: ../experiments/pre_trained_models/RCAN_BIX4.pt
