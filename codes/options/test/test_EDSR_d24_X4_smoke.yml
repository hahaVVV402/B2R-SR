name: EDSR_d24_X4_smoke_test
model: sr
test_backend: strict_sr
distortion: sr
scale: 4
gpu_ids: [0]

network_G:
  which_model_G: EDSR
  n_resblocks: 24
  n_feats: 256
  res_scale: 0.1
  n_colors: 3
  rgb_range: 255
  scale: 4

path:
  pretrain_model_G: ~
  strict_load: true

datasets:
  test1:
    name: recovery_smoke
    dataroot_GT: ${SR_DATA_ROOT}/SRBenchmarks/DIV2K_train_2K/HR
    dataroot_LQ: ${SR_DATA_ROOT}/SRBenchmarks/DIV2K_train_2K/LR_bicubic/X4
    max_images: 1

test:
  metrics: [psnr_y, ssim_y]
  save_images: true
  seed: 0

reproducibility:
  cudnn_benchmark: false
  cudnn_deterministic: true
  tf32: false
